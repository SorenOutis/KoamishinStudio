<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="100%" height="100%">
  <defs>
    <path id="seal-text-path" d="M 100, 100 m -68, 0 a 68,68 0 1,1 136,0 a 68,68 0 1,1 -136,0" />
  </defs>
  <style>
    .seal-bg { fill: none; stroke: currentColor; stroke-width: 1.2; stroke-dasharray: 2 3; }
    .seal-ring-outer { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .seal-ring-inner { fill: none; stroke: currentColor; stroke-width: 0.8; }
    .seal-text { font-family: "Space Mono", monospace; font-size: 8.5px; fill: currentColor; letter-spacing: 2.4px; text-transform: uppercase; }
    .seal-center-text { font-family: "Fraunces", Georgia, serif; font-size: 26px; font-weight: 600; fill: currentColor; }
    .seal-year { font-family: "Space Mono", monospace; font-size: 7px; fill: currentColor; letter-spacing: 2px; }
  </style>
  <circle cx="100" cy="100" r="92" class="seal-ring-outer" />
  <circle cx="100" cy="100" r="86" class="seal-bg" />
  <circle cx="100" cy="100" r="52" class="seal-ring-inner" />
  
  <text class="seal-text">
    <textPath href="#seal-text-path" startOffset="0%">
      MAYA CHEN ATELIER • LISBOA • ART DIRECTION &amp; DESIGN •
    </textPath>
  </text>
  
  <g transform="translate(100, 96)">
    <text text-anchor="middle" class="seal-center-text">MC</text>
    <text y="18" text-anchor="middle" class="seal-year">EST. 2017</text>
  </g>
</svg>
