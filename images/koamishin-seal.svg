    .k-seal-ring-outer { fill: none; stroke: currentColor; stroke-width: 1.5; }
    .k-seal-ring-inner { fill: none; stroke: currentColor; stroke-width: 0.8; }
    .k-seal-text { font-family: "Space Mono", monospace; font-size: 8px; fill: currentColor; letter-spacing: 2.2px; text-transform: uppercase; }
    .k-seal-center { font-family: "Fraunces", Georgia, serif; font-size: 26px; font-weight: 600; fill: currentColor; }
    .k-seal-sub { font-family: "Space Mono", monospace; font-size: 7px; fill: currentColor; letter-spacing: 1.5px; }
  </style>
  <circle cx="100" cy="100" r="92" class="k-seal-ring-outer" />
  <circle cx="100" cy="100" r="86" class="k-seal-bg" />
  <circle cx="100" cy="100" r="52" class="k-seal-ring-inner" />
  
  <text class="k-seal-text">
    <textPath href="#koami-seal-path" startOffset="0%">
      KOAMISHIN STUDIO • LARAVEL ARTISANS • CRAFT IN THE OPEN •
    </textPath>
  </text>
  
  <g transform="translate(100, 96)">
    <text text-anchor="middle" class="k-seal-center">KS</text>
    <text y="18" text-anchor="middle" class="k-seal-sub">EST. 2024</text>
